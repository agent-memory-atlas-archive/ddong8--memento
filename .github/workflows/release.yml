name: Release to PyPI

# Publishes the Python MCP server (memento-brain-memory) on a `pypi-v*` tag.
# The Python collector and the memento-brain meta package were retired in favour
# of the desktop app's Node daemon; their last releases stay on PyPI.
#
#   # 1. bump version in mcp_server/pyproject.toml
#   sed -i '' 's/version = "0\.0\.17"/version = "0.0.18"/' mcp_server/pyproject.toml
#   # 2. commit + tag + push
#   git commit -am "release: memento-brain-memory 0.0.18"
#   git tag pypi-v0.0.18 && git push && git push --tags
#
# Trusted publishing setup (one-time):
#   https://docs.pypi.org/trusted-publishers/adding-a-publisher/
#   For memento-brain-memory add a "GitHub" trusted publisher:
#     Repository owner: ddong8
#     Repository name:  memento
#     Workflow name:    release.yml
#     Environment:      pypi
#
# If trusted publishing isn't set up, fall back to an API token: uncomment the
# `password:` line in the publish step and add PYPI_API_TOKEN to repo secrets.

on:
  push:
    tags:
      # `pypi-v*` leaves the bare `v*` namespace for the apps (desktop-release.yml).
      - "pypi-v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Sanity: the git tag matches mcp_server/pyproject.toml ──
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the pyproject version matches the tag
        run: |
          TAG="${GITHUB_REF_NAME#pypi-v}"
          ver=$(grep -E '^version = ' mcp_server/pyproject.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$ver" != "$TAG" ]; then
            echo "::error::mcp_server/pyproject.toml has version=$ver but tag is pypi-v$TAG"
            exit 1
          fi
          echo "✓ mcp_server → $ver"

  build:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - name: Build
        working-directory: mcp_server
        run: python -m build
      - name: twine check
        working-directory: mcp_server
        run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist-mcp_server
          path: mcp_server/dist/
          retention-days: 7

  publish-memory:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/memento-brain-memory/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-mcp_server
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        # Trusted publishing (no password needed) — see workflow header for setup.
        # For API-token fallback, uncomment and add PYPI_API_TOKEN secret:
        # with:
        #   password: ${{ secrets.PYPI_API_TOKEN }}

  github-release:
    needs: publish-memory
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-mcp_server
          path: release-assets/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: false
          files: release-assets/*
