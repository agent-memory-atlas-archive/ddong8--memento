name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: ${{ matrix.package }} · py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: collector
            python: "3.10"
          - package: collector
            python: "3.12"
          - package: server
            python: "3.12"
          - package: mcp_server
            python: "3.10"
          - package: mcp_server
            python: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.package }}/pyproject.toml

      - name: Install package + dev deps
        working-directory: ${{ matrix.package }}
        run: |
          python -m pip install --upgrade pip
          # collector and server declare [dev] extras; mcp_server does not — fall back cleanly.
          pip install -e ".[dev]" || pip install -e .
          pip install pytest pytest-asyncio

      - name: AST syntax check
        working-directory: ${{ matrix.package }}
        run: python -m compileall -q .

      - name: pytest
        working-directory: ${{ matrix.package }}
        run: |
          if [ -d tests ] && [ "$(find tests -name 'test_*.py' | wc -l)" -gt 0 ]; then
            pytest -v
          else
            echo "No tests in ${{ matrix.package }}/tests — skipping."
          fi

  build-check:
    name: build · ${{ matrix.package }} (wheel + sdist + twine check)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [collector, mcp_server, memento_brain]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - name: Build
        working-directory: ${{ matrix.package }}
        run: python -m build
      - name: twine check
        working-directory: ${{ matrix.package }}
        run: twine check dist/*

  web:
    name: ts · core + daemon + mcp + desktop + mobile + web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      # npm workspace at the repo root: packages/*, apps/*, web
      - run: npm ci
        env:
          # Typechecking the desktop app doesn't need the Electron binary.
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: core · typecheck & test
        run: |
          npm run typecheck -w @memento/core
          npm run test -w @memento/core

      - name: daemon · typecheck & test
        run: |
          npm run typecheck -w @memento/daemon
          npm run test -w @memento/daemon

      - name: mcp · typecheck & test
        run: |
          npm run typecheck -w @memento/mcp
          npm run test -w @memento/mcp

      - name: desktop · typecheck & bundle
        run: |
          npm run build -w @memento/daemon
          npm run build -w @memento/mcp
          npm run typecheck -w @memento/desktop
          node apps/desktop/scripts/build.mjs

      - name: mobile · typecheck & bundle
        working-directory: apps/mobile
        run: |
          npm run build -w @memento/core
          npx tsc --noEmit
          npx expo export --platform android --output-dir /tmp/mobile-export

      - name: web · typecheck & build
        run: |
          npm run build -w web
          npm run typecheck -w web
      # Note: separate `npm run lint` 被 next.config 的 eslint.ignoreDuringBuilds
      # 一并绕过; React 19 hook 新规则产生的 18 个报错需单独整治后再恢复 lint gate。
