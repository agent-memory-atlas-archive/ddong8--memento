name: Flutter Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag (e.g. v1.0.3)"
        required: false
        default: ""

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (Apple Silicon arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build macOS Release
        working-directory: mobile
        run: flutter build macos --release

      - name: Package macOS App (.dmg and .zip)
        working-directory: mobile/build/macos/Build/Products/Release
        run: |
          set -e
          zip -r -y Memento-macos-arm64.zip Memento.app
          hdiutil create -volname "Memento" -srcfolder Memento.app -ov -format UDZO Memento-macos-arm64.dmg

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            mobile/build/macos/Build/Products/Release/Memento-macos-arm64.zip
            mobile/build/macos/Build/Products/Release/Memento-macos-arm64.dmg
          retention-days: 2

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Windows Release
        working-directory: mobile
        run: flutter build windows --release

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          $src = "mobile/build/windows/x64/runner/Release"
          $outZip = "mobile/build/windows/Memento-windows-x64.zip"
          Compress-Archive -Path "$src\*" -DestinationPath "$outZip" -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: mobile/build/windows/Memento-windows-x64.zip
          retention-days: 2

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare Release Tag
        id: release_meta
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.0.3" >> $GITHUB_OUTPUT
          fi

      - name: Upload Assets & Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: Memento ${{ steps.release_meta.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/macos-release/*
            dist/windows-release/*
