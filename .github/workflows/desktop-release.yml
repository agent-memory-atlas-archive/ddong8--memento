name: Flutter Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag (e.g. v1.0.3)"
        required: false
        default: ""

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (Apple Silicon arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build macOS Release
        working-directory: mobile
        run: flutter build macos --release

      - name: Package macOS App (.dmg and .zip)
        working-directory: mobile/build/macos/Build/Products/Release
        run: |
          set -e
          zip -r -y Memento-macos-arm64.zip Memento.app
          hdiutil create -volname "Memento" -srcfolder Memento.app -ov -format UDZO Memento-macos-arm64.dmg

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            mobile/build/macos/Build/Products/Release/Memento-macos-arm64.zip
            mobile/build/macos/Build/Products/Release/Memento-macos-arm64.dmg
          retention-days: 2

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Windows Release
        working-directory: mobile
        run: flutter build windows --release

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          $src = "mobile/build/windows/x64/runner/Release"
          $outZip = "mobile/build/windows/Memento-windows-x64.zip"
          Compress-Archive -Path "$src\*" -DestinationPath "$outZip" -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: mobile/build/windows/Memento-windows-x64.zip
          retention-days: 2

  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Linux Release
        working-directory: mobile
        run: flutter build linux --release

      - name: Package Linux Artifacts (.tar.gz and .deb)
        run: |
          set -e
          BUNDLE_DIR="mobile/build/linux/x64/release/bundle"
          OUTPUT_DIR="mobile/build/linux"
          mkdir -p "$OUTPUT_DIR"

          # 1. Package portable tar.gz
          mkdir -p "$OUTPUT_DIR/dist/memento"
          cp -r "$BUNDLE_DIR"/* "$OUTPUT_DIR/dist/memento/"
          tar -czvf "$OUTPUT_DIR/Memento-linux-x64.tar.gz" -C "$OUTPUT_DIR/dist" memento

          # 2. Package standard Debian/Ubuntu .deb package
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            VERSION="${{ github.event.inputs.tag_name }}"
            VERSION="${VERSION#v}"
          elif [ "$VERSION" = "$GITHUB_REF" ] || [ -z "$VERSION" ]; then
            VERSION=$(grep '^version:' mobile/pubspec.yaml | head -n 1 | awk '{print $2}' | cut -d'+' -f1)
          fi

          DEB_ROOT="deb-build"
          mkdir -p "$DEB_ROOT/opt/memento"
          mkdir -p "$DEB_ROOT/usr/bin"
          mkdir -p "$DEB_ROOT/usr/share/applications"
          mkdir -p "$DEB_ROOT/usr/share/icons/hicolor/512x512/apps"
          mkdir -p "$DEB_ROOT/DEBIAN"

          cp -r "$BUNDLE_DIR"/* "$DEB_ROOT/opt/memento/"
          chmod +x "$DEB_ROOT/opt/memento/memento"
          cat << 'WRAPPER' > "$DEB_ROOT/usr/bin/memento"
#!/bin/sh
exec /opt/memento/memento "$@"
WRAPPER
          chmod 755 "$DEB_ROOT/usr/bin/memento"
          cp mobile/linux/assets/memento.png "$DEB_ROOT/usr/share/icons/hicolor/512x512/apps/memento.png"
          cp mobile/linux/assets/memento.desktop "$DEB_ROOT/usr/share/applications/memento.desktop"
          chmod 644 "$DEB_ROOT/usr/share/applications/memento.desktop"
          chmod 644 "$DEB_ROOT/usr/share/icons/hicolor/512x512/apps/memento.png"

          cat <<EOF > "$DEB_ROOT/DEBIAN/control"
Package: memento
Version: $VERSION
Section: devel
Priority: optional
Architecture: amd64
Maintainer: Memento <support@ihasy.com>
Depends: libgtk-3-0
Description: Memento AI Coding Memory & Cross-Device Remote Dispatch Assistant
EOF

          dpkg-deb --build "$DEB_ROOT" "$OUTPUT_DIR/Memento-linux-amd64.deb"

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            mobile/build/linux/Memento-linux-x64.tar.gz
            mobile/build/linux/Memento-linux-amd64.deb
          retention-days: 2

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare Release Tag
        id: release_meta
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.0.4" >> $GITHUB_OUTPUT
          fi

      - name: Upload Assets & Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: Memento ${{ steps.release_meta.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/macos-release/*
            dist/windows-release/*
            dist/linux-release/*
